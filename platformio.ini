; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 115200
monitor_echo = yes

monitor_filters = hexlify
; 0000 |, 0010 |, 0020 |… 
; là offset byte do bộ lọc hexlify của PlatformIO thêm vào,
; để đánh số vị trí dữ liệu trong luồng nhận được.
; 0000 = byte thứ 0
; 0010 = byte thứ 16 (0x10 = 16)
; 0020 = byte thứ 32
; Mỗi dòng thường hiển thị tối đa 16 byte.
; Các số offset không phải dữ liệu Arduino gửi,
; cũng không phải timestamp hay số thứ tự frame.


build_flags =
    ; Các thông số hệ thống
    -D DEFAULT_SPEED=150

    ; Cấu hình chân điều khiển Driver Động cơ L298N
    -D PIN_M1_EN=5
    -D PIN_M1_IN1=10
    -D PIN_M1_IN2=11

    -D PIN_M2_EN=6
    -D PIN_M2_IN1=12
    -D PIN_M2_IN2=13

    ; Cấu hình chân đọc cảm biến tốc độ Encoder (M1 và M2)
    -D PIN_M1_H1=2
    -D PIN_M1_H2=4

    -D PIN_M2_H1=3
    -D PIN_M2_H2=7
; Arduino còn lại các chân: 9 (PWM), 8

; Các thư viện dùng
lib_deps =
    NicoHood/PinChangeInterrupt ; Dùng cho ngắt